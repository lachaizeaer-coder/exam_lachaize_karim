---
# tasks file for mysql
- name: Print OS family
  ansible.builtin.debug:
    msg: "OS Family: {{ ansible_facts['os_family'] }} - {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Load OS specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

# ---------- Installation ----------
- name: Install MySQL server and PyMySQL on Debian-based or Ubuntu-based systems
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install MySQL server and PyMySQL on RedHat-based systems
  ansible.builtin.dnf:
    name: "{{ mysql_packages }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Start and enable MySQL service
  ansible.builtin.service:
    name: "{{ mysql_service }}"
    state: started
    enabled: true
  become: true

# ---------- Network: listen on all interfaces so the web server can connect ----------
- name: Configure MySQL bind-address
  ansible.builtin.lineinfile:
    path: "{{ mysql_config_file }}"
    regexp: '^\s*bind-address'
    line: "bind-address = {{ MYSQL_BIND_ADDRESS }}"
    insertafter: '^\[mysqld\]'
  become: true
  notify: Restart MySQL

# ---------- Security (equivalent of mysql_secure_installation) ----------
- name: Set MySQL root password
  community.mysql.mysql_user:
    login_user: "{{ MYSQL_ROOT_LOGIN }}"
    login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    login_unix_socket: "{{ mysql_socket }}"
    check_implicit_admin: true   # 1st run with no root password -> socket login
    name: "{{ MYSQL_ROOT_NAME }}"
    host: "{{ MYSQL_HOST }}"
    plugin: caching_sha2_password           # mysql_native_password disabled
    plugin_auth_string: "{{ MYSQL_ROOT_PASSWORD }}"
    column_case_sensitive: true
    state: present
  become: true

- name: Remove anonymous MySQL users (to prevent access without password)
  community.mysql.mysql_user:
    login_user: "{{ MYSQL_ROOT_LOGIN }}"
    login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    login_unix_socket: "{{ mysql_socket }}"
    name: ''
    host_all: true
    state: absent
  become: true

- name: Remove test database
  community.mysql.mysql_db:
    login_user: "{{ MYSQL_ROOT_LOGIN }}"
    login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    login_unix_socket: "{{ mysql_socket }}"
    name: test
    state: absent
  become: true

# ---------- PrestaShop database and user ----------
- name: Create MySQL Prestashop database
  community.mysql.mysql_db:
    login_user: "{{ MYSQL_ROOT_LOGIN }}"
    login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    login_unix_socket: "{{ mysql_socket }}"
    name: "{{ MYSQL_DB_NAME }}"
    encoding: utf8mb4
    collation: utf8mb4_general_ci
    state: present
  become: true

- name: Create MySQL Prestashop user (allowed from the web server)
  community.mysql.mysql_user:
    login_user: "{{ MYSQL_ROOT_LOGIN }}"
    login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    login_unix_socket: "{{ mysql_socket }}"
    name: "{{ MYSQL_WEB_USER_LOGIN }}"
    host: "{{ MYSQL_WEB_HOST }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ MYSQL_WEB_USER_PASSWORD }}"
    priv: "{{ MYSQL_DB_NAME }}.*:ALL"
    column_case_sensitive: true
    update_password: on_create
    state: present
  become: true

# ---------- Firewall: open 3306 for the web server only ----------
- name: Gather services facts
  ansible.builtin.service_facts:

- name: Allow MySQL from the web server (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ MYSQL_PORT | string }}"
    proto: tcp
    from_ip: "{{ 'any' if MYSQL_WEB_HOST == '%' else MYSQL_WEB_HOST }}"
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Allow MySQL port (firewalld, only if it is running)
  ansible.posix.firewalld:
    port: "{{ MYSQL_PORT }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true
  when:
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts.services['firewalld.service'] is defined
    - ansible_facts.services['firewalld.service'].state == 'running'

# ---------- Check ----------
- name: Apply pending restarts before checking
  ansible.builtin.meta: flush_handlers

- name: Check that MySQL listens on port {{ MYSQL_PORT }}
  ansible.builtin.wait_for:
    port: "{{ MYSQL_PORT }}"
    host: "{{ ansible_facts['default_ipv4']['address'] }}"
    timeout: 30