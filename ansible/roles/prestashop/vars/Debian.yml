---
# Debian / Ubuntu specific values
prestashop_packages:
  - apache2
  - libapache2-mod-php
  - php
  - php-mysql
  - php-curl
  - php-gd
  - php-intl
  - php-mbstring
  - php-xml
  - php-zip
  - php-bcmath
  - unzip
apache_service: apache2
apache_user: www-data
apache_vhost_file: /etc/apache2/sites-available/prestashop.conf
apache_log_dir: /var/log/apache2
