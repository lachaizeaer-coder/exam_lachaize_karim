---
# defaults file for prestashop (can be overridden in group_vars)
PRESTASHOP_VERSION: "9.2.1"
PRESTASHOP_DOWNLOAD_URL: "https://github.com/PrestaShop/PrestaShop/releases/download/{{ PRESTASHOP_VERSION }}/prestashop_{{ PRESTASHOP_VERSION }}.zip"
PRESTASHOP_ROOT: /var/www/prestashop
# URL of the shop: public IP of the web server (use an Elastic IP or a DNS name in production)
PRESTASHOP_DOMAIN: "{{ ansible_host }}"

PRESTASHOP_SHOP_NAME: "Liora Shop"
PRESTASHOP_LANGUAGE: fr
PRESTASHOP_COUNTRY: fr
PRESTASHOP_DB_PREFIX: "ps_"

# Back office admin account
PRESTASHOP_ADMIN_FIRSTNAME: "Admin"
PRESTASHOP_ADMIN_LASTNAME: "Liora"
PRESTASHOP_ADMIN_EMAIL: "admin@liora-shop.com"
PRESTASHOP_ADMIN_PASSWORD: "LioraAdmin2026!"

# Database server: private IP of the database host from the inventory
DB_SERVER: "{{ hostvars[groups['database'][0]]['private_ip'] }}"
DB_PORT: 3306
