[defaults]
inventory           = ./inventory/hosts
roles_path          = ./roles
host_key_checking   = False
interpreter_python  = auto_silent
retry_files_enabled = False
stdout_callback     = yaml
log_path            = ./logs_ansible.txt
force_handlers      = True

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
