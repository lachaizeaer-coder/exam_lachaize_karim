# Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastapi-pvc
  namespace: standard
spec:
  storageClassName: 
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
# Deployment (fastAPI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  namespace: standard
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: fastapi-app:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://admin:password@db:5432/storedb"
        volumeMounts:
        - name: fastapi-storage
          mountPath: /app/data
      volumes:
      - name: fastapi-storage
        persistentVolumeClaim:
          claimName: fastapi-pvc
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: standard
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: fastapi
